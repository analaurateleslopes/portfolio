
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ana Laura</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="cabecalho">
    <div class="container menu">
        <a href="index.html" class="logo">Ana Laura.</a>
        <nav><a href="index.html">Voltar ao início</a></nav>
    </div>
</header>

<main class="login-container">
    <section class="login-card">
        <div class="login-icone">
            <i class="fa-solid fa-lock"></i>
        </div>

        <p class="subtitulo">ACESSO ADMINISTRATIVO</p>
        <h1>Área <span>restrita.</span></h1>

        <p class="login-descricao">
            Entre com seus dados para acessar o painel administrativo.
        </p>

        <form id="loginForm">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>

            <button type="submit" id="botaoLogin" class="btn">
                Entrar
            </button>

            <p id="mensagemLogin" aria-live="polite"></p>
        </form>

        <a href="index.html" class="voltar">Voltar para o site</a>
    </section>
</main>

<footer class="rodape">
    © 2026 Ana Laura Lopes. Todos os direitos reservados.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="java.js"></script>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const botao = document.getElementById("botaoLogin");
    const mensagem = document.getElementById("mensagemLogin");

    botao.disabled = true;
    botao.textContent = "Verificando...";
    mensagem.textContent = "";

    try {
        await window.supabaseApp.fazerLogin(
            document.getElementById("email").value.trim(),
            document.getElementById("senha").value
        );

        window.location.href = "painel.html";

    } catch (erro) {
        mensagem.textContent = erro.message;
        mensagem.style.color = "#f87171";
    } finally {
        botao.disabled = false;
        botao.textContent = "Entrar";
    }
});
</script>

</body>
</html>
