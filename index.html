
<section id="contato" class="contato-home">
    <div class="container">

        <div class="titulo-secao">
            <span>FALE COMIGO</span>
            <h2>Vamos conversar?</h2>
            <p>Preencha o formulário abaixo. Sua mensagem será enviada diretamente para meu painel.</p>
        </div>

        <form id="formContato" class="form-contato">

            <div class="campo-contato">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome"
                    placeholder="Digite seu nome" required>
            </div>

            <div class="campo-contato">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                    placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="campo-contato">
                <label for="whatsapp">WhatsApp</label>
                <input type="tel" id="whatsapp" name="whatsapp"
                    placeholder="(00) 00000-0000" required>
            </div>

            <div class="campo-contato">
                <label for="assunto">Assunto</label>
                <input type="text" id="assunto" name="assunto"
                    placeholder="Sobre o que deseja conversar?" required>
            </div>

            <div class="campo-contato campo-completo">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem"
                    placeholder="Escreva sua mensagem..." rows="5"
                    required></textarea>
            </div>

            <div class="privacidade campo-completo">
                <input type="checkbox" id="privacidade"
                    name="privacidade" required>
                <label for="privacidade">
                    Autorizo o envio e armazenamento dos meus dados
                    para que Ana Laura possa responder meu contato.
                </label>
            </div>

            <button type="submit" class="btn-contato campo-completo">
                Enviar mensagem
            </button>

            <p id="retornoContato" class="campo-completo"
                aria-live="polite"></p>

        </form>
    </div>
</section>
